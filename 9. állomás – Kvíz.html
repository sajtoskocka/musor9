<!DOCTYPE html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>9. állomás – Kvíz</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf7f2;--card:#fff;--tx:#1f2937;--mu:#6b7280;--red:#c8102e;--grn:#2e7d4f;--ln:#e5e7eb;--ok:#d9f2e2;--no:#fde0e4;--tud:#fff3c4;--dk:#1f2937}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111418;--card:#1c2128;--tx:#f3f4f6;--mu:#9ca3af;--ln:#374151;--ok:#1d4a30;--no:#5a1d27;--tud:#4a3c0a;--dk:#0b0e12}}
:root[data-theme=dark]{--bg:#111418;--card:#1c2128;--tx:#f3f4f6;--mu:#9ca3af;--ln:#374151;--ok:#1d4a30;--no:#5a1d27;--tud:#4a3c0a;--dk:#0b0e12}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:0 14px 40px}
.hd{display:flex;margin:0 -14px 14px;background:var(--dk);color:#fff}
.n{background:var(--red);font-size:40px;font-weight:800;min-width:76px;display:flex;align-items:center;justify-content:center}
.hd div{padding:12px 14px}.hd small{color:#f5b700;letter-spacing:.15em;font-weight:700;font-size:11px}
.hd h1{margin:0;font-size:24px;line-height:1.15}.hd p{margin:2px 0 0;color:#d1d5db;font-size:14px}
img.p{width:100%;border-radius:10px;display:block;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin:12px 0}
.card ul{margin:0;padding-left:20px}.card li{margin:4px 0}
.tud{background:var(--tud);border-left:6px solid #f5b700}.tud b{display:block;font-size:12px;letter-spacing:.1em}
.vid a{display:block;padding:8px 0;color:#0b5fd8;text-decoration:none;font-weight:600}
.vid a:before{content:"▶ ";color:var(--red)}
.q{font-weight:700;margin:0 0 8px}
.o{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--ln);border-radius:10px;padding:12px;margin:6px 0;min-height:48px}
.o.ok{background:var(--ok);border-color:var(--grn)}.o.no{background:var(--no);border-color:var(--red)}.o.sel{border-color:var(--red)}
.fb{font-size:14px;margin:4px 2px;color:var(--mu)}
textarea,input{width:100%;font:inherit;color:inherit;background:var(--bg);border:2px solid var(--ln);border-radius:10px;padding:10px}
textarea{min-height:90px}
.b{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 16px;min-height:48px;background:var(--red);color:#fff;margin-right:8px}
.b.g{background:var(--grn)}.b.l{background:var(--ln);color:var(--tx)}
</style></head><body><main id="m"></main>
<script type="application/json" id="c">{"id": 9, "title": "Kvíz", "sub": "8 gyors kérdés", "bul": ["Mennyit jegyeztél meg? Válaszolj mind a 8 kérdésre!"], "tud": "", "vid": [], "items": [{"t": "c", "q": "Melyik napon kezdődött a budapesti tömegtüntetés?", "o": ["1956. okt. 23.", "1956. nov. 4.", "1957. jan. 1."], "a": 0}, {"t": "c", "q": "Hány pontból állt a diákok követelése?", "o": ["8", "16", "20"], "a": 1}, {"t": "c", "q": "Melyik szobornál gyűltek össze? (lengyel tábornok)", "o": ["Bem-szobor", "Petőfi-szobor", "Kossuth-szobor"], "a": 0}, {"t": "c", "q": "Kit követeltek miniszterelnöknek?", "o": ["Mindszenty Józsefet", "Maléter Pált", "Nagy Imrét"], "a": 2}, {"t": "c", "q": "Melyik épülethez vonultak a rádióadás miatt?", "o": ["Parlament", "Magyar Rádió", "Műegyetem"], "a": 1}, {"t": "c", "q": "Mi lett a forradalom egyik jelképe?", "o": ["Lyukas zászló", "Vörös csillag", "Kék lufi"], "a": 0}, {"t": "c", "q": "Melyik egyetemen fogalmazták meg a 16 pontot?", "o": ["ELTE", "Debreceni Egyetem", "Budapesti Műszaki Egyetem"], "a": 2}, {"t": "c", "q": "Melyik ország eseményeivel vállaltak szolidaritást?", "o": ["Lengyelország", "Franciaország", "Svédország"], "a": 0}], "img": ""}</script>
<script>
const C=JSON.parse(document.getElementById('c').textContent),K='okt23_'+C.id;let S={};
try{S=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const m=document.getElementById('m');
function R(){
let h=`<div class="hd"><span class="n">${C.id}</span><div><small>ÁLLOMÁS</small><h1>${C.title}</h1><p>${C.sub}</p></div></div>`;
if(C.img)h+=`<img class="p" src="${C.img}" alt="">`;
h+=`<div class="card"><ul>${C.bul.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
if(C.tud)h+=`<div class="card tud"><b>TUDTAD?</b>${C.tud}</div>`;
if(C.vid.length)h+=`<div class="card vid">${C.vid.map(v=>`<a href="${v[1]}" target="_blank" rel="noopener">${v[0]}</a>`).join('')}</div>`;
C.items.forEach((it,i)=>{
h+=`<div class="card"><p class="q">${i+1}. ${it.q}</p>`;
if(it.t=='c')it.o.forEach((o,j)=>{const s=S[i];let c='o';if(s==j)c+=j==it.a?' ok':' no';h+=`<button class="${c}" onclick="P(${i},${j})">${o}</button>`});
if(it.t=='c'&&S[i]!=null)h+=`<div class="fb">${S[i]==it.a?'✅ Helyes!':'❌ Nem talált, próbáld újra!'}</div>`;
if(it.t=='x')h+=`<textarea placeholder="${it.ph}" oninput="S[${i}]=this.value;sv()">${(S[i]||'').replace(/</g,'&lt;')}</textarea>`;
if(it.t=='o'){const a=S[i]||[];it.o.forEach((o,j)=>{const k=a.indexOf(j);h+=`<button class="o${k>=0?' sel':''}" onclick="O(${i},${j})">${k>=0?'<b>'+(k+1)+'.</b> ':''}${o}</button>`});
h+=`<button class="b g" onclick="V(${i})">Ellenőrzés</button><button class="b l" onclick="S[${i}]=[];delete S['v${i}'];sv();R()">Törlés</button>`;
if(S['v'+i]!=null)h+=`<div class="fb">${S['v'+i]?'✅ Tökéletes sorrend!':'❌ Még nem jó, próbáld újra!'}</div>`}
h+='</div>'});
m.innerHTML=h}
function P(i,j){S[i]=j;sv();R()}
function O(i,j){const a=S[i]||[];if(!a.includes(j))a.push(j);S[i]=a;delete S['v'+i];sv();R()}
function V(i){const a=S[i]||[],c=C.items[i].a;S['v'+i]=a.length==c.length&&a.every((x,k)=>x==c[k]);sv();R()}
R();
</script></body></html>
